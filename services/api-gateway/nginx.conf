upstream auth_service   { server auth-service:8001; }
upstream exercise_svc   { server exercise-service:8002; }
upstream workout_svc    { server workout-service:8003; }
upstream analytics_svc  { server analytics-service:8004; }
upstream frontend_svc   { server frontend:3000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Auth service
    location /api/auth/ {
        proxy_pass         http://auth_service/auth/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Exercise service
    location /api/exercises {
        proxy_pass         http://exercise_svc/exercises;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Workout service
    location /api/workouts/ {
        proxy_pass         http://workout_svc/workouts/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Analytics service
    location /api/analytics/ {
        proxy_pass         http://analytics_svc/analytics/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health checks (pass-through to each service)
    location /api/health/auth {
        proxy_pass http://auth_service/health;
    }
    location /api/health/exercise {
        proxy_pass http://exercise_svc/health;
    }
    location /api/health/workout {
        proxy_pass http://workout_svc/health;
    }
    location /api/health/analytics {
        proxy_pass http://analytics_svc/health;
    }

    # Frontend (dev server)
    location / {
        proxy_pass         http://frontend_svc;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }
}
