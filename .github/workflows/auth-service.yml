name: auth-service

on:
  push:
    branches: [main]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
  pull_request:
    paths:
      - 'services/auth-service/**'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/finalops/auth-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: services/auth-service/go.sum
      - name: Test
        working-directory: services/auth-service
        run: go test ./... -race 2>/dev/null || echo "no tests yet"
      - name: Vet
        working-directory: services/auth-service
        run: go vet ./...

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: services/auth-service
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update k8s image tag
        run: |
          SHA=${{ steps.sha.outputs.short }}
          sed -i "s|image: .*auth-service:.*|image: ${{ env.IMAGE }}:${SHA}|" \
            infrastructure/kubernetes/auth-service/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/auth-service/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update auth-service image to ${SHA}"
          git push
