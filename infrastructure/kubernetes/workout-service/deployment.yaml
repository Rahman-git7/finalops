apiVersion: apps/v1
kind: Deployment
metadata:
  name: workout-service
  namespace: finalops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workout-service
  template:
    metadata:
      labels:
        app: workout-service
    spec:
      containers:
        - name: workout-service
          image: ghcr.io/rahman-git7/finalops/workout-service:bf25a11
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: EXERCISE_SERVICE_URL
              value: "http://exercise-service:8002"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finalops-secrets
                  key: JWT_SECRET
            - name: WORKOUT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finalops-secrets
                  key: WORKOUT_DB_PASSWORD
            - name: DB_DSN
              value: "postgres://workout_user:$(WORKOUT_DB_PASSWORD)@postgres:5432/finalops?search_path=workout&sslmode=disable"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: workout-service
  namespace: finalops
spec:
  selector:
    app: workout-service
  ports:
    - port: 8003
      targetPort: 8003
