# IMPORTANT: Do NOT commit real secrets here.
# Create this secret manually on the cluster:
#
#   kubectl create secret generic finalops-secrets \
#     --namespace finalops \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=POSTGRES_PASSWORD=your_secure_password \
#     --from-literal=AUTH_DB_PASSWORD=your_secure_password \
#     --from-literal=EXERCISE_DB_PASSWORD=your_secure_password \
#     --from-literal=WORKOUT_DB_PASSWORD=your_secure_password
#
# This file is a reference only — the actual secret is created via the command above.
apiVersion: v1
kind: Secret
metadata:
  name: finalops-secrets
  namespace: finalops
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  AUTH_DB_PASSWORD: "REPLACE_ME"
  EXERCISE_DB_PASSWORD: "REPLACE_ME"
  WORKOUT_DB_PASSWORD: "REPLACE_ME"
