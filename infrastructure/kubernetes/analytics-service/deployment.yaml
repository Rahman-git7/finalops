apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: finalops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: ghcr.io/rahman-git7/finalops/analytics-service:cdc9e62
          ports:
            - containerPort: 8004
          env:
            - name: PORT
              value: "8004"
            - name: WORKOUT_SERVICE_URL
              value: "http://workout-service:8003"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: CACHE_TTL
              value: "5m"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finalops-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: finalops
spec:
  selector:
    app: analytics-service
  ports:
    - port: 8004
      targetPort: 8004
