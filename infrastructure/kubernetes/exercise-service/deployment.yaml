apiVersion: apps/v1
kind: Deployment
metadata:
  name: exercise-service
  namespace: finalops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exercise-service
  template:
    metadata:
      labels:
        app: exercise-service
    spec:
      containers:
        - name: exercise-service
          image: ghcr.io/rahman-git7/finalops/exercise-service:bf25a11
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finalops-secrets
                  key: JWT_SECRET
            - name: EXERCISE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finalops-secrets
                  key: EXERCISE_DB_PASSWORD
            - name: DB_DSN
              value: "postgres://exercise_user:$(EXERCISE_DB_PASSWORD)@postgres:5432/finalops?search_path=exercise&sslmode=disable"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: exercise-service
  namespace: finalops
spec:
  selector:
    app: exercise-service
  ports:
    - port: 8002
      targetPort: 8002
