apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finalops-infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rahman-git7/finalops.git
    targetRevision: main
    path: infrastructure/kubernetes
    directory:
      recurse: true
      exclude: '{api-gateway/ingress.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: finalops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
